# Take It Over! under a path of an EXISTING Apache site, e.g. https://example.com/play/
# Requires: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# Add inside the existing <VirtualHost *:443> block, then:
#   sudo apachectl configtest && sudo systemctl reload apache2
# Game container: 127.0.0.1:8087, started with TIO_PUBLIC_PATH=/play/.

    RedirectMatch 301 ^/play$ /play/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/play/ws$ ws://127.0.0.1:8087/ws [P,L]

    ProxyPass        /play/ http://127.0.0.1:8087/
    ProxyPassReverse /play/ http://127.0.0.1:8087/
    ProxyTimeout 3600
