# Take It Over! under a path of an EXISTING Apache site, e.g. https://example.com/play/
# Requires Apache 2.4.47+ (WebSocket through mod_proxy_http's upgrade=websocket) and:
#   sudo a2enmod proxy proxy_http headers rewrite
# Paste these lines inside the existing <VirtualHost *:443> block, ABOVE the
# site's own RewriteRule and ProxyPass lines. Back up the file first, then:
#   sudo apachectl configtest && sudo systemctl reload apache2
# Game container: 127.0.0.1:8087, started with TIO_PUBLIC_PATH=/play/ and
# TIO_ALLOWED_ORIGINS=https://example.com.
#
# Why this shape: an existing rule of the site can otherwise take the game's URLs.
# - The site's RewriteRules run before any ProxyPass (e.g. a rule that sends
#   *.js/*.css/*.png to the site's app would also take the game's files).
#   "RewriteRule ^/play/ - [L]" stops them for /play/, so it must come first.
# - ProxyPass lines are tried in configuration order, so an earlier
#   "ProxyPass / ..." takes /play/ too. A ProxyPass inside <Location /play/> is
#   checked before that list, wherever it is placed.
# - A bare /play would be proxied by "ProxyPass /" before RedirectMatch runs:
#   the redirect is a RewriteRule for the same reason.
# - Everything is scoped to /play/: a VirtualHost-wide ProxyPreserveHost,
#   RequestHeader or ProxyTimeout would change the site's other apps too.
# The site's <LocationMatch> deny rules (hidden files, *.bak) still apply here.

    RewriteEngine On
    RewriteRule ^/play$ /play/ [R=301,L]
    RewriteRule ^/play/ - [L]

    <Location /play/>
        ProxyPass        http://127.0.0.1:8087/ upgrade=websocket timeout=3600
        ProxyPassReverse http://127.0.0.1:8087/
        # The server compares Origin with Host: keep the client's Host.
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
