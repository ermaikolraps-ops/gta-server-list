# Take It Over! on its own subdomain, e.g. https://play.example.com/
#
# A separate server block: nothing else on the server changes. Get the
# certificate the same way your other sites do, for example:
#   sudo certbot --nginx -d play.example.com
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# The game container listens on 127.0.0.1:8087 only and runs with TIO_PUBLIC_PATH=/.

map $http_upgrade $connection_upgrade {   # skip if already defined at http level
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.com;

    # Filled in by certbot, or point at your existing certificate files:
    # ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;        # keep the port: the server checks Origin against it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 512k;
    }
}
