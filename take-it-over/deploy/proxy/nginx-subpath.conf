# Take It Over! under a path of an EXISTING nginx site, e.g. https://example.com/play/
#
# Two parts. Leave the site's certificates and other locations alone.
#   PART 1 goes once at http level: at the top of the site file, outside any
#          server { } block (sites-enabled/* is included inside http { }), or in
#          /etc/nginx/conf.d/takeitover.conf.
#   PART 2 goes inside the existing server { } block that serves the site over
#          HTTPS. The order of location blocks does not matter.
# Back up the site file first, then: sudo nginx -t && sudo systemctl reload nginx
#
# The game container listens on 127.0.0.1:${TIO_PORT} only (see docker-compose.prod.yml)
# and runs with TIO_PUBLIC_PATH=/play/ and TIO_ALLOWED_ORIGINS=https://example.com.
#
# Why "location ^~" and not a plain "location /play/": nginx checks regex
# locations after prefix ones and a matching regex WINS over a plain prefix.
# Sites commonly have rules like "location ~* \.(js|css|png|svg|ico)$" (caching),
# so with a plain prefix the game's JS, CSS, icons, manifest and sw.js are sent
# to the site's own app instead of the game (blank page, service worker fails).
# "^~" makes nginx stop at this prefix and skip the site's regex locations.
# That also skips the site's hidden-file/backup deny rules, so they are repeated
# inside the block.
#
# Why a variable of our own ($tio_connection_upgrade): nginx accepts a second
# "map ... $connection_upgrade" without any warning and the last one silently
# wins, which could change how the site's other apps are proxied.

# ===== PART 1: http level (once) =====
map $http_upgrade $tio_connection_upgrade {
    default upgrade;
    ''      close;
}
# ===== END PART 1 =====

# ===== PART 2: inside the existing HTTPS server { } block =====
    location = /play {
        return 301 /play/$is_args$args;
    }

    location ^~ /play/ {
        # The site's deny rules do not apply under ^~: repeat them.
        location ~ /\. { return 404; }
        location ~* \.(bak|orig|old|backup|swp)$ { return 404; }

        proxy_pass http://127.0.0.1:8087/;       # trailing slash strips /play
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # WebSocket (/play/ws)
        proxy_set_header Connection $tio_connection_upgrade;
        proxy_set_header Host $http_host;         # the server compares Origin with Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                 # keep idle game WebSockets open
        client_max_body_size 512k;

        # Do not inherit server-level settings meant for the site itself.
        proxy_cache off;                # never cache player-specific API answers
        expires off;                    # keep the game's Cache-Control (index.html, sw.js: no-cache)
        proxy_intercept_errors off;     # the game's JSON errors reach the game, not the site's error pages

        # nginx's default gzip_types is text/html only: compress the 1.4 MB bundle too.
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    }
# ===== END PART 2 =====
