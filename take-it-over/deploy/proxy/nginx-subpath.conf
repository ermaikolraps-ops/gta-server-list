# Take It Over! under a path of an EXISTING nginx site, e.g. https://example.com/play/
#
# Paste the two `location` blocks into the existing `server { … }` block that
# already serves your site over HTTPS (leave its certificates and other
# locations alone), and put the `map` block once at http level
# (e.g. /etc/nginx/conf.d/websocket-upgrade.conf) unless you already have it.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# The game container listens on 127.0.0.1:${TIO_PORT} only (see docker-compose.prod.yml),
# and must be started with TIO_PUBLIC_PATH=/play/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- inside the existing server { } block ---------------------------------
    location = /play {
        return 301 /play/;
    }

    location /play/ {
        proxy_pass http://127.0.0.1:8087/;      # trailing slash strips /play
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket (/play/ws)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;        # keep the port: the server checks Origin against it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                # keep game WebSockets open
        client_max_body_size 512k;
    }
# ---------------------------------------------------------------------------
