# Take It Over! at https://gamerol.online/takeitover/
# nginx blocks for the EXISTING gamerol.online site: /etc/nginx/sites-available/gamerol
# (enabled through the symlink in /etc/nginx/sites-enabled/). Nothing else in the
# file changes; no service is restarted (nginx is reloaded, which drops no connections).
#
# Game side, deploy/.env on the VPS (stack already up and healthy):
#   TIO_PORT=8087
#   TIO_PUBLIC_PATH=/takeitover/
#   TIO_ALLOWED_ORIGINS=https://gamerol.online
#     (append ,https://www.gamerol.online only if www serves the site instead of redirecting)
#   check: curl -s http://127.0.0.1:8087/api/health   -> {"ok":true,...}
#   If 8087 was taken and TIO_PORT is different, change proxy_pass below to match.
#
# ---------------------------------------------------------------------------
# 1. READ-ONLY CHECKS BEFORE THE CHANGE (show the output to the owner)
#   readlink -f /etc/nginx/sites-enabled/gamerol            # must be /etc/nginx/sites-available/gamerol
#   grep -n 'include.*sites-enabled' /etc/nginx/nginx.conf  # inside http { }: so the top of the site file is http level
#   sudo nginx -T 2>/dev/null | grep -n -E 'tio_connection_upgrade|takeitover'   # must print nothing (not applied yet)
#   sudo grep -n -E '^\s*(server_name|listen|location|rewrite|if |return|add_header|expires|proxy_cache|proxy_intercept_errors|error_page|try_files|include)' \
#        /etc/nginx/sites-available/gamerol
#   Look at that output for:
#   - The server { } block with "listen 443 ssl" and "server_name gamerol.online": PART 2 goes
#     in THAT block (not in the port-80 block, which only redirects to https).
#   - "add_header Content-Security-Policy" at server level: it would also apply to the game,
#     whose map needs https://tiles.openfreemap.org (tiles and fonts) and blob: workers.
#     If present, stop and adapt before applying.
#   - A server-level "rewrite" that strips trailing slashes would loop with the 301 below.
#   - "location ^~ /takeitover" or "location = /takeitover" already present: stop.
#   Record the current answers so they can be compared afterwards:
#     for p in / /golazomanager/ /stuntrace2026/ /pb/ /api/estado/jugadores /sw.js; do
#       printf '%s ' "$p"; curl -sk --resolve gamerol.online:443:127.0.0.1 -o /dev/null \
#         -w '%{http_code} %{content_type}\n' "https://gamerol.online$p"; done
#   If /sw.js exists, the main site has a service worker with scope /. It also sees the first
#   visit to /takeitover/ until the game's own worker (scope /takeitover/) takes over. A plain
#   network/caching worker is fine (tested); one that answers EVERY navigation with the main
#   site's cached page (a navigation fallback without a denylist) must exclude /takeitover/.
#
# 2. APPLY (house rules: backup outside the web root, WORKLOG entry, commit it)
#   TS=$(date +%Y%m%d-%H%M%S)
#   sudo install -d -m 700 /opt/gamerol/backups-fuera-de-web/etc/nginx/sites-available
#   sudo cp -a /etc/nginx/sites-available/gamerol \
#        "/opt/gamerol/backups-fuera-de-web/etc/nginx/sites-available/gamerol.$TS"
#     Never leave a copy in /etc/nginx/sites-enabled/: nginx loads every file in it.
#   Edit /etc/nginx/sites-available/gamerol:
#     - PART 1 at the top of the file, before the first "server {" (outside every server block);
#     - PART 2 inside the 443 server block, e.g. next to "location /golazomanager/".
#   sudo nginx -t && sudo systemctl reload nginx
#     If nginx -t fails: restore the backup (ROLLBACK below); nginx keeps running the old config.
#
# 3. VERIFY FROM THE SERVER
#   B() { curl -sk --resolve gamerol.online:443:127.0.0.1 "$@"; }
#   B -o /dev/null -w '%{http_code} %{redirect_url}\n' https://gamerol.online/takeitover   # 301 https://gamerol.online/takeitover/
#   B -o /dev/null -w '%{http_code} %{content_type}\n' https://gamerol.online/takeitover/  # 200 text/html
#   B https://gamerol.online/takeitover/api/health                                          # {"ok":true,...}
#   Every file of the game must come from the game (it sends an x-ratelimit-limit header):
#   for f in sw.js manifest.webmanifest icons/icon-192.png \
#            $(B https://gamerol.online/takeitover/sw.js | grep -oE 'workbox-[0-9a-f]+' | sed 's/$/.js/') \
#            $(B https://gamerol.online/takeitover/ | grep -oE 'assets/[^"]+'); do
#     printf '%s ' "$f"; B -o /dev/null -D - "https://gamerol.online/takeitover/$f" \
#       | grep -i -E '^(HTTP|content-type|x-ratelimit-limit)' | tr -d '\r' | tr '\n' ' '; echo; done
#   B -o /dev/null -w '%{http_code}\n' https://gamerol.online/takeitover/.env             # 404
#   B -o /dev/null -w '%{http_code}\n' -X POST -H 'Origin: https://evil.example' -H 'X-TIO-Client: 1' \
#     -H 'Content-Type: application/json' --data '{}' https://gamerol.online/takeitover/api/auth/login   # 403
#   Re-run the loop from step 1: the existing paths must answer exactly as before.
#   Then on a phone: open https://gamerol.online/takeitover/, create an account, Start GPS.
#
# ROLLBACK
#   sudo cp -a "/opt/gamerol/backups-fuera-de-web/etc/nginx/sites-available/gamerol.$TS" \
#        /etc/nginx/sites-available/gamerol && sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------
#
# Why it is written this way (each point was reproduced on a mock of this site):
# - "location ^~ /takeitover/", not a plain prefix: nginx checks regex locations after the
#   prefix ones and a matching regex wins over a plain prefix. A static-file rule such as
#   "location ~* \.(js|css|png|svg|ico|webmanifest)$" would send the game's JS, CSS, icons,
#   manifest and sw.js to gamerol-web (404): blank page, no service worker. "^~" stops there.
# - "^~" also skips the site's ".env/.git" and "*.bak/.orig/.old/.backup/.swp" 404 rules, so
#   they are repeated inside the block (the game would otherwise answer them with its
#   index page: harmless, but the house rule is a 404).
# - $tio_connection_upgrade instead of $connection_upgrade: nginx accepts a second map of
#   the same variable without a warning and the last one silently wins, which could change
#   how the other apps (e.g. Colyseus WebSockets) are proxied.
# - proxy_cache/expires/proxy_intercept_errors off: server-level settings of the site must
#   not cache player data, override the game's no-cache for index.html and sw.js, or replace
#   the game's JSON errors with HTML error pages.
# - gzip: the default gzip_types is text/html only; the game bundle is 1.4 MB uncompressed.

# ===== PART 1: http level, top of /etc/nginx/sites-available/gamerol, outside every server block =====
map $http_upgrade $tio_connection_upgrade {
    default upgrade;
    ''      close;
}
# ===== END PART 1 =====

# ===== PART 2: inside the "listen 443 ssl" server block of gamerol.online =====
    # Take It Over! (game container on 127.0.0.1:8087) - see /opt/take-it-over/deploy/sites/gamerol.online/
    location = /takeitover {
        return 301 /takeitover/$is_args$args;
    }

    location ^~ /takeitover/ {
        # The site's deny rules do not apply under ^~: repeat them.
        location ~ /\. { return 404; }
        location ~* \.(bak|orig|old|backup|swp)$ { return 404; }

        proxy_pass http://127.0.0.1:8087/;       # trailing slash strips /takeitover
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # WebSocket (/takeitover/ws)
        proxy_set_header Connection $tio_connection_upgrade;
        proxy_set_header Host $http_host;         # the server compares Origin with Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                 # keep idle game WebSockets open
        client_max_body_size 512k;

        proxy_cache off;
        expires off;
        proxy_intercept_errors off;

        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    }
# ===== END PART 2 =====
